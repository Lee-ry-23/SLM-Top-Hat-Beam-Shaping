[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-top-hat-beam-shaping"
version = "0.1.0"
description = "CG optimization tools for SLM top-hat beam shaping."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py",
    "matplotlib",
    "numpy",
    "scipy",
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]
